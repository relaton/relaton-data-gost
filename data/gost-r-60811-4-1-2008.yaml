title:
- language: rus
  content: Общие методы испытаний материалов изоляции и оболочек электрических и оптических
    кабелей. Часть 4-1. Специальные методы испытаний полиэтиленовых и полипропиленовых
    композиций. Стойкость к растрескиванию под напряжением в условиях окружающей среды.
    Определение показателя текучести расплава. Определение содержания сажи и/или минерального
    наполнителя в полиэтилене методом непосредственного сжигания. Определение содержания
    сажи методом термогравиметрического анализа (TGA). Определение дисперсии сажи
    в полиэтилене с помощью микроскопа
