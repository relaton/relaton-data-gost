title:
- language: rus
  content: Настоящий стандарт устанавливает способ измерения, используемый для определения
    величин сопротивления теплопередаче и коэффициента теплопередачи многослойного
    остекления с плоскими и параллельными поверхностями. Поверхности с рельефом, такие
    как узорчатое стекло, также могут рассматриваться как плоские. Настоящий стандарт
    применим к многослойному остеклению с внешними листами, которые непрозрачны для
    излучения в дальнем инфракрасном диапазоне, что выполняется в случае обычного
    стекла. Вместе с тем, внутренние элементы остекления могут быть прозрачными в
    дальнем инфракрасном диапазоне. Настоящий стандарт позволяет определить величины
    R (сопротивление теплопередаче) и U (коэффициент теплопередачи) в центральной
    области многослойного остекления. Краевые эффекты, связанные с тепловым мостиком
    через дистанционную рамку клееного стеклопакета или раму не рассматриваются. Кроме
    того, передача энергии за счет солнечного излучения также не учитывается
  type: main
